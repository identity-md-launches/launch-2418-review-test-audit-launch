[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = ["@uniswap/v4-core/=lib/v4-core/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/", "solmate/=lib/solmate/"]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
